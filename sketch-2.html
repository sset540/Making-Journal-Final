<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbit — Music as Space</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
    }

    canvas {
      display: block;
      position: fixed;
      top: 0; left: 0;
    }

    /* ── AUTH SCREEN ──────────────────────────────────────────── */
    #auth-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      background: #000;
    }

    #auth-title {
      font-size: 11px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 12px;
    }

    #auth-sub {
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.15);
      margin-bottom: 48px;
    }

    #auth-btn {
      font-family: 'Courier New', Courier, monospace;
      font-size: 9px;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: none;
      border: 1px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.55);
      padding: 14px 32px;
      cursor: pointer;
      transition: border-color 0.4s, color 0.4s;
    }

    #auth-btn:hover {
      border-color: rgba(255,255,255,0.55);
      color: rgba(255,255,255,0.9);
    }

    #auth-error {
      font-size: 9px;
      letter-spacing: 2px;
      color: rgba(255,100,100,0.6);
      margin-top: 20px;
      display: none;
    }

    /* ── SEARCH ───────────────────────────────────────────────── */
    #search-wrapper {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      width: 300px;
      display: none;
    }

    #search-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.6);
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      letter-spacing: 2px;
      padding: 8px 0;
      outline: none;
      text-align: center;
      transition: border-color 0.3s;
    }

    #search-input::placeholder { color: rgba(255,255,255,0.18); }
    #search-input:focus        { border-bottom-color: rgba(255,255,255,0.4); }

    #results-list {
      display: none;
      margin-top: 2px;
      background: rgba(4,4,12,0.92);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
    }

    .result-item {
      padding: 10px 16px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background 0.2s;
    }

    .result-item:last-child { border-bottom: none; }
    .result-item:hover      { background: rgba(255,255,255,0.04); }

    .result-name {
      font-size: 10px;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.65);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-artist {
      font-size: 8px;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.3);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <!-- Auth screen -->
  <div id="auth-screen">
    <div id="auth-title">Orbit</div>
    <div id="auth-sub">Music as Space</div>
    <button id="auth-btn" onclick="startAuth()">Connect Spotify</button>
    <div id="auth-error">Please add your Spotify Client ID to sketch.html</div>
  </div>

  <!-- Search UI -->
  <div id="search-wrapper">
    <input id="search-input" type="text" placeholder="search for a song" autocomplete="off" spellcheck="false" />
    <div id="results-list"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <script>
    // ════════════════════════════════════════════════════════════════
    //  SPOTIFY CONFIGURATION
    //  1. Go to developer.spotify.com → create an app
    //  2. Add your redirect URI (the URL of this file) in app settings
    //  3. Paste your Client ID below
    // ════════════════════════════════════════════════════════════════
    const CLIENT_ID   = 'e64dfc1cf6774aad8e7ce4e67b64dd10';
    const REDIRECT_URI = 'https://sset540.github.io/Making-Journal-Final/sketch-2.html';

    let accessToken = null;

    // ── PKCE HELPERS ─────────────────────────────────────────────────
    function genVerifier(len = 128) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
      const arr = new Uint8Array(len);
      crypto.getRandomValues(arr);
      return Array.from(arr, b => chars[b % chars.length]).join('');
    }

    async function genChallenge(verifier) {
      const data   = new TextEncoder().encode(verifier);
      const digest = await crypto.subtle.digest('SHA-256', data);
      return btoa(String.fromCharCode(...new Uint8Array(digest)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function startAuth() {
      if (CLIENT_ID === 'YOUR_CLIENT_ID_HERE') {
        document.getElementById('auth-error').style.display = 'block';
        return;
      }
      const verifier  = genVerifier();
      const challenge = await genChallenge(verifier);
      sessionStorage.setItem('pkce_verifier', verifier);

      const params = new URLSearchParams({
        client_id:             CLIENT_ID,
        response_type:         'code',
        redirect_uri:          REDIRECT_URI,
        code_challenge_method: 'S256',
        code_challenge:        challenge,
        scope:                 '',
      });
      window.location = `https://accounts.spotify.com/authorize?${params}`;
    }

    async function exchangeToken(code) {
      const verifier = sessionStorage.getItem('pkce_verifier');
      const res = await fetch('https://accounts.spotify.com/api/token', {
        method:  'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          client_id:     CLIENT_ID,
          grant_type:    'authorization_code',
          code,
          redirect_uri:  REDIRECT_URI,
          code_verifier: verifier,
        }),
      });
      const data = await res.json();
      return data.access_token || null;
    }

    async function spotifyGet(endpoint) {
      if (!accessToken) return null;
      const res = await fetch(`https://api.spotify.com/v1${endpoint}`, {
        headers: { Authorization: `Bearer ${accessToken}` },
      });
      if (!res.ok) return null;
      return res.json();
    }

    // ── INIT: handle redirect or show auth screen ─────────────────────
    (async () => {
      const code = new URLSearchParams(window.location.search).get('code');
      if (code) {
        window.history.replaceState({}, '', REDIRECT_URI);
        accessToken = await exchangeToken(code);
        if (accessToken) showApp();
      }
    })();

    function showApp() {
      document.getElementById('auth-screen').style.display   = 'none';
      document.getElementById('search-wrapper').style.display = 'block';
    }

    // ── SEARCH LOGIC ─────────────────────────────────────────────────
    const searchInput = document.getElementById('search-input');
    const resultsList = document.getElementById('results-list');
    let searchTimer;

    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      const q = searchInput.value.trim();
      if (!q || q.length < 2) { resultsList.style.display = 'none'; return; }
      searchTimer = setTimeout(() => doSearch(q), 420);
    });

    document.addEventListener('click', e => {
      if (!e.target.closest('#search-wrapper')) resultsList.style.display = 'none';
    });

    let trackResults = [];

    async function doSearch(q) {
      if (!accessToken) return;
      const data = await spotifyGet(`/search?q=${encodeURIComponent(q)}&type=track&limit=5`);
      if (!data?.tracks?.items?.length) return;

      trackResults = data.tracks.items;
      resultsList.innerHTML = '';
      trackResults.forEach(track => {
        const el = document.createElement('div');
        el.className = 'result-item';
        el.innerHTML = `
          <div class="result-name">${track.name}</div>
          <div class="result-artist">${track.artists[0].name}</div>`;
        el.addEventListener('mousedown', (e) => { e.preventDefault(); selectTrack(track); });
        resultsList.appendChild(el);
      });
      resultsList.style.display = 'block';
    }

    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && trackResults.length > 0) {
        selectTrack(trackResults[0]);
      }
      if (e.key === 'Escape') { resultsList.style.display = 'none'; searchInput.blur(); }
    });

    function hashToFloat(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) {
        h = Math.imul(31, h) + str.charCodeAt(i) | 0;
      }
      return (Math.abs(h) % 10000) / 10000;
    }

    function selectTrack(track) {
      resultsList.style.display = 'none';
      searchInput.value = '';

      // Energy: from popularity — varies widely between songs
      const energy = track.popularity / 100;

      // Valence → hue: use the seconds part of duration (0–59 → 0–1)
      // This gives genuine hue variation: a 3m42s track vs a 4m07s track
      // will produce very different colours
      const durationSec = Math.floor(track.duration_ms / 1000);
      const valence = (durationSec % 60) / 59;

      // Acousticness: longer tracks tend to be more mellow
      const durationMin = track.duration_ms / 60000;
      const acousticness = Math.min(1, Math.max(0, (durationMin - 1.5) / 5.5));

      // Tempo: correlated with energy
      const tempo = 65 + energy * 115;

      applyFeatures({ valence, energy, acousticness, tempo }, track.name, track.artists[0].name);
    }
  </script>


  <script>
    // ── SHARED STATE ─────────────────────────────────────────────
    let cur = { valence: 0.2, energy: 0.15, acousticness: 0.8, hue: 240 };
    let tgt = { ...cur };
    let lerpSpd  = 0.028;
    let trackName  = '';
    let artistName = '';
    let noTrack    = true;

    function applyFeatures(f, name, artist) {
      const clamp = (v) => isNaN(v) ? 0.5 : Math.min(1, Math.max(0, v));
      tgt.valence      = clamp(f.valence);
      tgt.energy       = clamp(f.energy);
      tgt.acousticness = clamp(f.acousticness);
      tgt.hue          = (240 + tgt.valence * 150) % 360;
      lerpSpd          = 0.028;
      trackName        = name;
      artistName       = artist;
      noTrack          = false;
    }

    let bgStars = [], fgStars = [], heroStars = [], neb = [];

    new p5(function(p) {

      p.setup = function() {
        p.createCanvas(p.windowWidth, p.windowHeight);
        p.colorMode(p.HSB, 360, 100, 100, 100);
        p.noStroke();
        build();
      };

      p.windowResized = function() {
        p.resizeCanvas(p.windowWidth, p.windowHeight);
        build();
      };

      function build() {
        // Faint background pin-prick stars — always visible
        bgStars = Array.from({ length: 140 }, () => ({
          x: Math.random(), y: Math.random(),
          sz: p.random(0.4, 1.4),
          a:  p.random(18, 45),
        }));

        // Main star field — density driven by energy
        fgStars = Array.from({ length: 210 }, () => ({
          x:  Math.random(), y: Math.random(),
          z:  Math.random(),
          sz: p.random(0.9, 2.8),
          tw: p.random(p.TWO_PI),
        }));

        // Large feature stars with bloom halo
        heroStars = Array.from({ length: 8 }, () => ({
          x:  Math.random(), y: Math.random(),
          sz: p.random(2.5, 4.5),
          tw: p.random(p.TWO_PI),
        }));

        // Nebula cloud particles — ellipse distributed, biased toward centre
        neb = Array.from({ length: 120 }, () => {
          const a = p.random(p.TWO_PI);
          const r = Math.pow(Math.random(), 0.4);
          return {
            nx:    r * Math.cos(a),
            ny:    r * Math.sin(a) * 0.58,
            seed:  p.random(5000),
            layer: Math.floor(p.random(3)),
          };
        });
      }

      p.draw = function() {
        // Smooth lerp toward target
        const lp = lerpSpd;
        cur.valence      = p.lerp(cur.valence,      tgt.valence,      lp);
        cur.energy       = p.lerp(cur.energy,        tgt.energy,       lp);
        cur.acousticness = p.lerp(cur.acousticness,  tgt.acousticness, lp);
        const dh = ((tgt.hue - cur.hue + 540) % 360) - 180;
        cur.hue = (cur.hue + dh * lp + 360) % 360;

        drawBg();
        drawNebula();
        drawBgStars();
        drawFgStars();
        drawHeroStars();
        drawPortrait();
        if (noTrack) drawPrompt();
      };

      // ── BACKGROUND ──────────────────────────────────────────────
      // Dark but colour-shifted per song. Brightness 6–15% keeps it
      // space-like regardless of hue. Clearly shifts between songs.
      function drawBg() {
        const h   = cur.hue;
        const sat = p.map(cur.energy, 0, 1, 38, 62);
        const bri = p.map(cur.energy, 0, 1,  6, 15);
        p.background(h, sat, bri);
      }

      // ── NEBULA ──────────────────────────────────────────────────
      // Soft glowing cloud in the centre of the canvas.
      // Colour, size, and brightness all change with the song.
      function drawNebula() {
        const t    = p.frameCount * 0.0003;
        const cx   = p.width  * 0.5;
        const cy   = p.height * 0.46;
        const maxR = Math.min(p.width, p.height) * 0.28;

        // acousticness → how diffuse/large the cloud is
        const soft = p.map(cur.acousticness, 0, 1, 0.75, 1.3);
        // energy → how bright and saturated the nebula is
        const bri  = p.map(cur.energy, 0, 1, 38, 82);
        const sat  = p.map(cur.energy, 0, 1, 62, 94);

        // Three layers with slight hue variation — like real nebulae
        const hOff = [-18, 0, 22];

        for (const pt of neb) {
          const n    = p.noise(pt.seed * 0.3 + t, pt.seed * 0.18 + t * 0.55);
          const dist = Math.sqrt(pt.nx * pt.nx + pt.ny * pt.ny);
          const fall = Math.max(0, 1 - dist);
          // Alpha 15: visible but translucent so dark space shows through
          const alpha = n * fall * fall * 15 * soft;
          if (alpha < 0.8) continue;

          const h   = (cur.hue + hOff[pt.layer] + 360) % 360;
          const str = 0.65 + n * 0.65;
          const x   = cx + pt.nx * maxR * str;
          const y   = cy + pt.ny * maxR * str;
          const sz  = maxR * 0.48 * soft * (0.25 + n * 0.75);

          p.fill(h, sat, bri, alpha);
          p.ellipse(x, y, sz, sz * 0.76);
        }

        // Central bright core — the hottest part of the nebula
        const coreBri = Math.min(100, bri * 1.35);
        p.fill(cur.hue, sat * 0.45, coreBri, p.map(cur.energy, 0, 1, 10, 28));
        p.ellipse(cx, cy, maxR * 0.28 * soft, maxR * 0.17 * soft);
      }

      // ── BACKGROUND STARS (always on) ────────────────────────────
      function drawBgStars() {
        for (const s of bgStars) {
          p.fill(0, 0, 95, s.a);
          p.ellipse(s.x * p.width, s.y * p.height, s.sz, s.sz);
        }
      }

      // ── FOREGROUND STARS (energy-driven count) ───────────────────
      function drawFgStars() {
        const count = Math.floor(p.map(cur.energy, 0, 1, 28, fgStars.length));
        const t     = p.frameCount * 0.001;
        for (let i = 0; i < count; i++) {
          const s = fgStars[i];
          const tw  = 0.62 + 0.38 * Math.sin(t * 2.4 + s.tw);
          const alp = 72 * tw * p.map(cur.energy, 0, 1, 0.3, 1.0);
          const x   = (s.x + Math.sin(t * 0.28 + s.z * 5) * s.z * 0.01) * p.width;
          const y   = (s.y + Math.cos(t * 0.22 + s.z * 4) * s.z * 0.008) * p.height;
          p.fill(0, 0, 98, alp);
          p.ellipse(x, y, s.sz * tw, s.sz * tw);
        }
      }

      // ── HERO STARS (bright points with coloured bloom) ───────────
      function drawHeroStars() {
        const t = p.frameCount * 0.0007;
        for (const s of heroStars) {
          const tw = 0.82 + 0.18 * Math.sin(t * 1.5 + s.tw);
          const x  = s.x * p.width;
          const y  = s.y * p.height;
          const sz = s.sz * tw;
          // Coloured outer glow — hue of current environment
          p.fill(cur.hue, 35, 100,  7);
          p.ellipse(x, y, sz * 6, sz * 6);
          p.fill(cur.hue, 12, 100, 18);
          p.ellipse(x, y, sz * 2.5, sz * 2.5);
          // Pure white core
          p.fill(0, 0, 100, 92 * tw);
          p.ellipse(x, y, sz, sz);
        }
      }

      // ── DATA PORTRAIT ────────────────────────────────────────────
      function drawPortrait() {
        const r  = 18;
        const mx = 34;
        const my = p.height - 34 - r - 22;
        p.push();
        p.translate(mx, my);
        p.noFill();
        p.strokeWeight(1.2);
        // Valence arc
        p.stroke(cur.hue, 70, 90, 55);
        p.arc(0, 0, r * 2, r * 2, -p.HALF_PI, -p.HALF_PI + cur.valence * p.TWO_PI);
        // Energy arc
        p.stroke((cur.hue + 35) % 360, 55, 82, 48);
        p.arc(0, 0, r * 1.28, r * 1.28, -p.HALF_PI, -p.HALF_PI + cur.energy * p.TWO_PI);
        if (!noTrack) {
          p.noStroke();
          p.textFont('Courier New');
          p.textAlign(p.LEFT, p.TOP);
          p.textSize(9);
          p.fill(0, 0, 90, 58);
          p.text(clip(trackName, 22),  -r, r + 12);
          p.textSize(8);
          p.fill(0, 0, 62, 40);
          p.text(clip(artistName, 22), -r, r + 24);
        }
        p.pop();
      }

      function clip(s, n) { return s.length > n ? s.slice(0, n) + '…' : s; }

      // ── PROMPT ───────────────────────────────────────────────────
      function drawPrompt() {
        p.push();
        p.noStroke();
        p.fill(0, 0, 70, 16);
        p.textFont('Courier New');
        p.textSize(10);
        p.textAlign(p.CENTER, p.CENTER);
        p.text('search for a song below', p.width / 2, p.height / 2 + 95);
        p.pop();
      }

    }); // end p5
  </script>

</body>
</html>
