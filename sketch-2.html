<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbit — Music as Space</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
    }

    canvas {
      display: block;
      position: fixed;
      top: 0; left: 0;
    }

    /* ── AUTH SCREEN ──────────────────────────────────────────── */
    #auth-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      background: #000;
    }

    #auth-title {
      font-size: 11px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 12px;
    }

    #auth-sub {
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.15);
      margin-bottom: 48px;
    }

    #auth-btn {
      font-family: 'Courier New', Courier, monospace;
      font-size: 9px;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: none;
      border: 1px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.55);
      padding: 14px 32px;
      cursor: pointer;
      transition: border-color 0.4s, color 0.4s;
    }

    #auth-btn:hover {
      border-color: rgba(255,255,255,0.55);
      color: rgba(255,255,255,0.9);
    }

    #auth-error {
      font-size: 9px;
      letter-spacing: 2px;
      color: rgba(255,100,100,0.6);
      margin-top: 20px;
      display: none;
    }

    /* ── SEARCH ───────────────────────────────────────────────── */
    #search-wrapper {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      width: 300px;
      display: none;
    }

    #search-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.6);
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      letter-spacing: 2px;
      padding: 8px 0;
      outline: none;
      text-align: center;
      transition: border-color 0.3s;
    }

    #search-input::placeholder { color: rgba(255,255,255,0.18); }
    #search-input:focus        { border-bottom-color: rgba(255,255,255,0.4); }

    #results-list {
      display: none;
      margin-top: 2px;
      background: rgba(4,4,12,0.92);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
    }

    .result-item {
      padding: 10px 16px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background 0.2s;
    }

    .result-item:last-child { border-bottom: none; }
    .result-item:hover      { background: rgba(255,255,255,0.04); }

    .result-name {
      font-size: 10px;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.65);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-artist {
      font-size: 8px;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.3);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <!-- Auth screen -->
  <div id="auth-screen">
    <div id="auth-title">Orbit</div>
    <div id="auth-sub">Music as Space</div>
    <button id="auth-btn" onclick="startAuth()">Connect Spotify</button>
    <div id="auth-error">Please add your Spotify Client ID to sketch.html</div>
  </div>

  <!-- Search UI -->
  <div id="search-wrapper">
    <input id="search-input" type="text" placeholder="search for a song" autocomplete="off" spellcheck="false" />
    <div id="results-list"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <script>
    // ════════════════════════════════════════════════════════════════
    //  SPOTIFY CONFIGURATION
    //  1. Go to developer.spotify.com → create an app
    //  2. Add your redirect URI (the URL of this file) in app settings
    //  3. Paste your Client ID below
    // ════════════════════════════════════════════════════════════════
    const CLIENT_ID   = 'e64dfc1cf6774aad8e7ce4e67b64dd10';
    const REDIRECT_URI = 'https://sset540.github.io/Making-Journal-Final/sketch-2.html';

    let accessToken = null;

    // ── PKCE HELPERS ─────────────────────────────────────────────────
    function genVerifier(len = 128) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
      const arr = new Uint8Array(len);
      crypto.getRandomValues(arr);
      return Array.from(arr, b => chars[b % chars.length]).join('');
    }

    async function genChallenge(verifier) {
      const data   = new TextEncoder().encode(verifier);
      const digest = await crypto.subtle.digest('SHA-256', data);
      return btoa(String.fromCharCode(...new Uint8Array(digest)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function startAuth() {
      if (CLIENT_ID === 'YOUR_CLIENT_ID_HERE') {
        document.getElementById('auth-error').style.display = 'block';
        return;
      }
      const verifier  = genVerifier();
      const challenge = await genChallenge(verifier);
      sessionStorage.setItem('pkce_verifier', verifier);

      const params = new URLSearchParams({
        client_id:             CLIENT_ID,
        response_type:         'code',
        redirect_uri:          REDIRECT_URI,
        code_challenge_method: 'S256',
        code_challenge:        challenge,
        scope:                 '',
      });
      window.location = `https://accounts.spotify.com/authorize?${params}`;
    }

    async function exchangeToken(code) {
      const verifier = sessionStorage.getItem('pkce_verifier');
      const res = await fetch('https://accounts.spotify.com/api/token', {
        method:  'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          client_id:     CLIENT_ID,
          grant_type:    'authorization_code',
          code,
          redirect_uri:  REDIRECT_URI,
          code_verifier: verifier,
        }),
      });
      const data = await res.json();
      return data.access_token || null;
    }

    async function spotifyGet(endpoint) {
      if (!accessToken) return null;
      const res = await fetch(`https://api.spotify.com/v1${endpoint}`, {
        headers: { Authorization: `Bearer ${accessToken}` },
      });
      if (!res.ok) return null;
      return res.json();
    }

    // ── INIT: handle redirect or show auth screen ─────────────────────
    (async () => {
      const code = new URLSearchParams(window.location.search).get('code');
      if (code) {
        window.history.replaceState({}, '', REDIRECT_URI);
        accessToken = await exchangeToken(code);
        if (accessToken) showApp();
      }
    })();

    function showApp() {
      document.getElementById('auth-screen').style.display   = 'none';
      document.getElementById('search-wrapper').style.display = 'block';
    }

    // ── SEARCH LOGIC ─────────────────────────────────────────────────
    const searchInput = document.getElementById('search-input');
    const resultsList = document.getElementById('results-list');
    let searchTimer;

    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      const q = searchInput.value.trim();
      if (!q || q.length < 2) { resultsList.style.display = 'none'; return; }
      searchTimer = setTimeout(() => doSearch(q), 420);
    });

    document.addEventListener('click', e => {
      if (!e.target.closest('#search-wrapper')) resultsList.style.display = 'none';
    });

    let trackResults = [];

    async function doSearch(q) {
      if (!accessToken) return;
      const data = await spotifyGet(`/search?q=${encodeURIComponent(q)}&type=track&limit=5`);
      if (!data?.tracks?.items?.length) return;

      trackResults = data.tracks.items;
      resultsList.innerHTML = '';
      trackResults.forEach(track => {
        const el = document.createElement('div');
        el.className = 'result-item';
        el.innerHTML = `
          <div class="result-name">${track.name}</div>
          <div class="result-artist">${track.artists[0].name}</div>`;
        el.addEventListener('click', () => selectTrack(track));
        resultsList.appendChild(el);
      });
      resultsList.style.display = 'block';
    }

    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && trackResults.length > 0) {
        selectTrack(trackResults[0]);
      }
      if (e.key === 'Escape') { resultsList.style.display = 'none'; searchInput.blur(); }
    });

    function hashToFloat(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) {
        h = Math.imul(31, h) + str.charCodeAt(i) | 0;
      }
      return (Math.abs(h) % 10000) / 10000;
    }

    function selectTrack(track) {
      resultsList.style.display = 'none';
      searchInput.value = '';
      const energy       = track.popularity / 100;
      const dur          = track.duration_ms;
      const acousticness = Math.min(1, Math.max(0, (dur - 120000) / 360000));
      const valence      = hashToFloat(track.id);
      const tempo        = 70 + energy * 110;
      applyFeatures({ valence, energy, acousticness, tempo }, track.name, track.artists[0].name);
    }
  </script>

  <script>
    // ════════════════════════════════════════════════════════════════
    //  P5.JS SKETCH
    // ════════════════════════════════════════════════════════════════

    // ── SHARED STATE (updated by selectTrack) ────────────────────────
    // Lerped toward target each frame
    let cur = { valence: 0.25, energy: 0.18, acousticness: 0.85, hue: 248 };
    let tgt = { ...cur };
    let lerpSpd  = 0.010;
    let trackName  = '';
    let artistName = '';
    let noTrack    = true;

    function applyFeatures(f, name, artist) {
      tgt.valence      = f.valence;
      tgt.energy       = f.energy;
      tgt.acousticness = f.acousticness;
      tgt.hue          = hueFromValence(f.valence);
      // Higher tempo → slightly snappier onset (easing curve effect)
      lerpSpd = 0.008 + (f.tempo - 40) / (200 - 40) * 0.012;
      lerpSpd = Math.min(0.020, Math.max(0.007, lerpSpd));
      trackName  = name;
      artistName = artist;
      noTrack    = false;
    }

    function hueFromValence(v) {
      // 0 → 252 (deep blue-violet)  1 → 32 (warm amber)
      return 252 - v * 220;
    }

    // ── STARS ────────────────────────────────────────────────────────
    let stars = [];
    const N_STARS = 270;

    function initStars(p) {
      stars = Array.from({ length: N_STARS }, (_, i) => {
        const tier = i < N_STARS * 0.62 ? 0 : i < N_STARS * 0.87 ? 1 : 2;
        return {
          nx: Math.random(),
          ny: Math.random(),
          z:  Math.random(),
          tier,
          sz:  tier === 0 ? p.random(0.6, 1.5) : tier === 1 ? p.random(1.6, 3.0) : p.random(3.2, 5.8),
          tw:  p.random(1000),
          hShift: p.random(-18, 18),
        };
      });
    }

    // ── NEBULA PARTICLES ─────────────────────────────────────────────
    let nebula = [];
    const N_NEB = 220;

    function initNebula(p) {
      nebula = Array.from({ length: N_NEB }, () => {
        const angle = Math.random() * Math.PI * 2;
        const r     = Math.pow(Math.random(), 0.45); // bias toward center
        return {
          nx:    r * Math.cos(angle),
          ny:    r * Math.sin(angle) * 0.62, // vertical squash
          seed:  p.random(2000),
          layer: Math.floor(Math.random() * 3),
        };
      });
    }

    // ── P5 INSTANCE ──────────────────────────────────────────────────
    new p5(function(p) {

      p.setup = function() {
        p.createCanvas(p.windowWidth, p.windowHeight);
        p.colorMode(p.HSB, 360, 100, 100, 100);
        p.noStroke();
        initStars(p);
        initNebula(p);
      };

      p.windowResized = function() {
        p.resizeCanvas(p.windowWidth, p.windowHeight);
      };

      // ── DRAW LOOP ───────────────────────────────────────────────────
      p.draw = function() {
        // Lerp state toward target
        cur.valence      = p.lerp(cur.valence,      tgt.valence,      lerpSpd);
        cur.energy       = p.lerp(cur.energy,        tgt.energy,       lerpSpd);
        cur.acousticness = p.lerp(cur.acousticness,  tgt.acousticness, lerpSpd);
        cur.hue          = lerpHue(cur.hue, tgt.hue, lerpSpd);

        // Background
        const bgB = p.map(cur.energy, 0, 1, 3, 11);
        const bgS = p.map(cur.valence, 0, 1, 55, 35);
        p.background(cur.hue, bgS, bgB);

        drawNebula();
        drawStars();
        drawPortrait();
        if (noTrack) drawPrompt();
      };

      // ── HELPERS ─────────────────────────────────────────────────────
      function lerpHue(a, b, t) {
        let d = b - a;
        if (d >  180) d -= 360;
        if (d < -180) d += 360;
        return (a + d * t + 360) % 360;
      }

      // ── NEBULA ──────────────────────────────────────────────────────
      function drawNebula() {
        const t   = p.frameCount * 0.00035;
        const cx  = p.width  * 0.5;
        const cy  = p.height * 0.455;
        const maxR = Math.min(p.width, p.height) * 0.33;

        const soft = p.map(cur.acousticness, 0, 1, 0.65, 1.35);
        const bri  = p.map(cur.energy,       0, 1, 18,   62);
        const sat  = p.map(cur.valence,      0, 1, 72,   48);

        const hShifts = [0, 18, -12];

        for (const pt of nebula) {
          const n     = p.noise(pt.seed * 0.5 + t, pt.seed * 0.3 + t * 0.65);
          const dist  = Math.sqrt(pt.nx * pt.nx + pt.ny * pt.ny);
          const fall  = Math.max(0, 1 - dist);
          const alpha = n * fall * fall * 32 * soft;
          if (alpha < 0.8) continue;

          const h  = (cur.hue + hShifts[pt.layer] + 360) % 360;
          const stretch = 0.75 + n * 0.55;
          const x  = cx + pt.nx * maxR * stretch;
          const y  = cy + pt.ny * maxR * stretch;
          const sz = maxR * 0.38 * soft * (0.25 + n * 0.75);

          p.fill(h, sat, bri, alpha);
          p.ellipse(x, y, sz, sz * 0.78);
        }

        // Central core glow
        const coreAlpha = p.map(cur.energy, 0, 1, 8, 22);
        p.fill(cur.hue, sat * 0.55, bri * 1.15, coreAlpha);
        p.ellipse(cx, cy, maxR * 0.28 * soft, maxR * 0.18 * soft);
      }

      // ── STARS ────────────────────────────────────────────────────────
      function drawStars() {
        const visibleCount = Math.floor(p.map(cur.energy, 0, 1, 55, N_STARS));
        const t = p.frameCount * 0.0009;

        for (let i = 0; i < visibleCount; i++) {
          const s = stars[i];
          // Parallax: deeper stars (high z) drift more slowly
          const px = (s.nx + Math.sin(t * 0.28 + s.z * 4) * s.z * 0.018) * p.width;
          const py = (s.ny + Math.cos(t * 0.22 + s.z * 3) * s.z * 0.013) * p.height;

          const twinkle = 0.72 + 0.28 * Math.sin(t * 2.8 + s.tw);
          const baseAlpha = s.tier === 0 ? 52 : s.tier === 1 ? 72 : 88;
          const alpha = baseAlpha * twinkle * p.map(cur.energy, 0, 1, 0.35, 1.0);

          const h   = (cur.hue + s.hShift + 360) % 360;
          const sat = p.map(cur.valence, 0, 1, 18, 8);
          const bri = s.tier === 2 ? 100 : s.tier === 1 ? 94 : 86;

          p.fill(h, sat, bri, alpha);
          const sz = s.sz * twinkle;
          p.ellipse(px, py, sz, sz);

          // Halo on large stars
          if (s.tier === 2) {
            p.fill(h, sat * 0.4, 100, alpha * 0.12);
            p.ellipse(px, py, sz * 5, sz * 5);
          }
        }
      }

      // ── DATA PORTRAIT ────────────────────────────────────────────────
      function drawPortrait() {
        const mx = 32;
        const my = p.height - 32;
        const r  = 20;

        p.push();
        p.translate(mx, my - r - 18);
        p.noFill();

        // Valence arc (outer)
        p.strokeWeight(1.2);
        p.stroke(cur.hue, 58, 88, 48);
        p.arc(0, 0, r * 2, r * 2, -p.HALF_PI,
              -p.HALF_PI + cur.valence * p.TWO_PI);

        // Energy arc (inner)
        p.stroke((cur.hue + 22) % 360, 48, 80, 42);
        p.arc(0, 0, r * 1.3, r * 1.3, -p.HALF_PI,
              -p.HALF_PI + cur.energy * p.TWO_PI);

        // Track info
        if (!noTrack) {
          p.noStroke();
          p.textFont('Courier New');
          p.textAlign(p.LEFT, p.TOP);

          p.textSize(9);
          p.fill(0, 0, 88, 52);
          p.text(truncate(trackName, 24),  -r, r + 12);

          p.textSize(8);
          p.fill(0, 0, 65, 38);
          p.text(truncate(artistName, 24), -r, r + 23);
        }

        p.pop();
      }

      function truncate(str, n) {
        return str.length > n ? str.slice(0, n) + '…' : str;
      }

      // ── PROMPT (shown before first track) ────────────────────────────
      function drawPrompt() {
        p.push();
        p.noStroke();
        p.fill(0, 0, 75, 18);
        p.textFont('Courier New');
        p.textSize(10);
        p.textAlign(p.CENTER, p.CENTER);
        p.text('search for a song below', p.width / 2, p.height / 2 + 90);
        p.pop();
      }

    }); // end p5
  </script>

</body>
</html>
