<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbit — Music as Space</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
    }

    canvas {
      display: block;
      position: fixed;
      top: 0; left: 0;
    }

    /* ── AUTH SCREEN ──────────────────────────────────────────── */
    #auth-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      background: #000;
    }

    #auth-title {
      font-size: 11px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 12px;
    }

    #auth-sub {
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.15);
      margin-bottom: 48px;
    }

    #auth-btn {
      font-family: 'Courier New', Courier, monospace;
      font-size: 9px;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: none;
      border: 1px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.55);
      padding: 14px 32px;
      cursor: pointer;
      transition: border-color 0.4s, color 0.4s;
    }

    #auth-btn:hover {
      border-color: rgba(255,255,255,0.55);
      color: rgba(255,255,255,0.9);
    }

    #auth-error {
      font-size: 9px;
      letter-spacing: 2px;
      color: rgba(255,100,100,0.6);
      margin-top: 20px;
      display: none;
    }

    /* ── SEARCH ───────────────────────────────────────────────── */
    #search-wrapper {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      width: 300px;
      display: none;
    }

    #search-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.6);
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      letter-spacing: 2px;
      padding: 8px 0;
      outline: none;
      text-align: center;
      transition: border-color 0.3s;
    }

    #search-input::placeholder { color: rgba(255,255,255,0.18); }
    #search-input:focus        { border-bottom-color: rgba(255,255,255,0.4); }

    #results-list {
      display: none;
      margin-top: 2px;
      background: rgba(4,4,12,0.92);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
    }

    .result-item {
      padding: 10px 16px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background 0.2s;
    }

    .result-item:last-child { border-bottom: none; }
    .result-item:hover      { background: rgba(255,255,255,0.04); }

    .result-name {
      font-size: 10px;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.65);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-artist {
      font-size: 8px;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.3);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <!-- Auth screen -->
  <div id="auth-screen">
    <div id="auth-title">Orbit</div>
    <div id="auth-sub">Music as Space</div>
    <button id="auth-btn" onclick="startAuth()">Connect Spotify</button>
    <div id="auth-error">Please add your Spotify Client ID to sketch.html</div>
  </div>

  <!-- Search UI -->
  <div id="search-wrapper">
    <input id="search-input" type="text" placeholder="search for a song" autocomplete="off" spellcheck="false" />
    <div id="results-list"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <script>
    // ════════════════════════════════════════════════════════════════
    //  SPOTIFY CONFIGURATION
    //  1. Go to developer.spotify.com → create an app
    //  2. Add your redirect URI (the URL of this file) in app settings
    //  3. Paste your Client ID below
    // ════════════════════════════════════════════════════════════════
    const CLIENT_ID   = 'e64dfc1cf6774aad8e7ce4e67b64dd10';
    const REDIRECT_URI = 'https://sset540.github.io/Making-Journal-Final/sketch-2.html';

    let accessToken = null;

    // ── PKCE HELPERS ─────────────────────────────────────────────────
    function genVerifier(len = 128) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
      const arr = new Uint8Array(len);
      crypto.getRandomValues(arr);
      return Array.from(arr, b => chars[b % chars.length]).join('');
    }

    async function genChallenge(verifier) {
      const data   = new TextEncoder().encode(verifier);
      const digest = await crypto.subtle.digest('SHA-256', data);
      return btoa(String.fromCharCode(...new Uint8Array(digest)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function startAuth() {
      if (CLIENT_ID === 'YOUR_CLIENT_ID_HERE') {
        document.getElementById('auth-error').style.display = 'block';
        return;
      }
      const verifier  = genVerifier();
      const challenge = await genChallenge(verifier);
      sessionStorage.setItem('pkce_verifier', verifier);

      const params = new URLSearchParams({
        client_id:             CLIENT_ID,
        response_type:         'code',
        redirect_uri:          REDIRECT_URI,
        code_challenge_method: 'S256',
        code_challenge:        challenge,
        scope:                 '',
      });
      window.location = `https://accounts.spotify.com/authorize?${params}`;
    }

    async function exchangeToken(code) {
      const verifier = sessionStorage.getItem('pkce_verifier');
      const res = await fetch('https://accounts.spotify.com/api/token', {
        method:  'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          client_id:     CLIENT_ID,
          grant_type:    'authorization_code',
          code,
          redirect_uri:  REDIRECT_URI,
          code_verifier: verifier,
        }),
      });
      const data = await res.json();
      return data.access_token || null;
    }

    async function spotifyGet(endpoint) {
      if (!accessToken) return null;
      const res = await fetch(`https://api.spotify.com/v1${endpoint}`, {
        headers: { Authorization: `Bearer ${accessToken}` },
      });
      if (!res.ok) return null;
      return res.json();
    }

    // ── INIT: handle redirect or show auth screen ─────────────────────
    (async () => {
      const code = new URLSearchParams(window.location.search).get('code');
      if (code) {
        window.history.replaceState({}, '', REDIRECT_URI);
        accessToken = await exchangeToken(code);
        if (accessToken) showApp();
      }
    })();

    function showApp() {
      document.getElementById('auth-screen').style.display   = 'none';
      document.getElementById('search-wrapper').style.display = 'block';
    }

    // ── SEARCH LOGIC ─────────────────────────────────────────────────
    const searchInput = document.getElementById('search-input');
    const resultsList = document.getElementById('results-list');
    let searchTimer;

    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      const q = searchInput.value.trim();
      if (!q || q.length < 2) { resultsList.style.display = 'none'; return; }
      searchTimer = setTimeout(() => doSearch(q), 420);
    });

    document.addEventListener('click', e => {
      if (!e.target.closest('#search-wrapper')) resultsList.style.display = 'none';
    });

    let trackResults = [];

    async function doSearch(q) {
      if (!accessToken) return;
      const data = await spotifyGet(`/search?q=${encodeURIComponent(q)}&type=track&limit=5`);
      if (!data?.tracks?.items?.length) return;

      trackResults = data.tracks.items;
      resultsList.innerHTML = '';
      trackResults.forEach(track => {
        const el = document.createElement('div');
        el.className = 'result-item';
        el.innerHTML = `
          <div class="result-name">${track.name}</div>
          <div class="result-artist">${track.artists[0].name}</div>`;
        el.addEventListener('mousedown', (e) => { e.preventDefault(); selectTrack(track); });
        resultsList.appendChild(el);
      });
      resultsList.style.display = 'block';
    }

    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && trackResults.length > 0) {
        selectTrack(trackResults[0]);
      }
      if (e.key === 'Escape') { resultsList.style.display = 'none'; searchInput.blur(); }
    });

    function hashToFloat(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) {
        h = Math.imul(31, h) + str.charCodeAt(i) | 0;
      }
      return (Math.abs(h) % 10000) / 10000;
    }

    function selectTrack(track) {
      resultsList.style.display = 'none';
      searchInput.value = '';

      // Energy: from popularity — varies widely between songs
      const energy = track.popularity / 100;

      // Valence → hue: use the seconds part of duration (0–59 → 0–1)
      // This gives genuine hue variation: a 3m42s track vs a 4m07s track
      // will produce very different colours
      const durationSec = Math.floor(track.duration_ms / 1000);
      const valence = (durationSec % 60) / 59;

      // Acousticness: longer tracks tend to be more mellow
      const durationMin = track.duration_ms / 60000;
      const acousticness = Math.min(1, Math.max(0, (durationMin - 1.5) / 5.5));

      // Tempo: correlated with energy
      const tempo = 65 + energy * 115;

      applyFeatures({ valence, energy, acousticness, tempo }, track.name, track.artists[0].name);
    }
  </script>

  <script>
    // ════════════════════════════════════════════════════════════════
    //  P5.JS SKETCH — Space Visualiser
    // ════════════════════════════════════════════════════════════════

    // ── SHARED STATE ─────────────────────────────────────────────
    let cur = { valence: 0.1, energy: 0.1, acousticness: 0.9, hue: 240 };
    let tgt = { ...cur };
    let lerpSpd  = 0.035;
    let trackName  = '';
    let artistName = '';
    let noTrack    = true;

    function applyFeatures(f, name, artist) {
      tgt.valence      = f.valence;
      tgt.energy       = f.energy;
      tgt.acousticness = f.acousticness;
      tgt.hue          = hueFromValence(f.valence);
      lerpSpd = Math.min(0.045, Math.max(0.025, 0.025 + (f.tempo - 40) / 160 * 0.02));
      trackName  = name;
      artistName = artist;
      noTrack    = false;
    }

    function hueFromValence(v) {
      if (isNaN(v) || v === undefined) v = 0.5;
      v = Math.min(1, Math.max(0, v));
      // blue-violet → purple → magenta-pink → amber-red (avoids green)
      return (240 + v * 150) % 360;
    }

    // ── STAR / NEBULA ARRAYS ──────────────────────────────────────
    let bgStars    = [];  // always-visible pin-prick background field
    let fgStars    = [];  // energy-driven main star field
    let heroStars  = [];  // bright feature stars with bloom
    let nebParticles = []; // nebula cloud particles

    new p5(function(p) {

      p.setup = function() {
        p.createCanvas(p.windowWidth, p.windowHeight);
        p.colorMode(p.HSB, 360, 100, 100, 100);
        p.noStroke();
        buildField();
      };

      p.windowResized = function() {
        p.resizeCanvas(p.windowWidth, p.windowHeight);
        buildField();
      };

      function buildField() {
        // Background pin-prick stars — always visible, very faint
        bgStars = Array.from({ length: 130 }, () => ({
          x: p.random(), y: p.random(),
          sz: p.random(0.3, 0.85),
          a: p.random(12, 35),
        }));

        // Main star field — count scales with energy
        fgStars = Array.from({ length: 230 }, () => ({
          x: p.random(), y: p.random(),
          z: p.random(0.1, 1.0),   // depth for parallax
          sz: p.random(0.8, 2.6),
          tw: p.random(p.TWO_PI),  // twinkle phase
        }));

        // Hero / feature stars — always present, large with glow halo
        heroStars = Array.from({ length: 9 }, () => ({
          x: p.random(), y: p.random(),
          sz: p.random(3.5, 6.5),
          tw: p.random(p.TWO_PI),
        }));

        // Nebula cloud — 90 particles is enough for a soft glow without filling the screen
        nebParticles = Array.from({ length: 90 }, () => {
          const angle = p.random(p.TWO_PI);
          const r = Math.pow(p.random(), 0.45); // bias toward centre
          return {
            nx:    r * Math.cos(angle),
            ny:    r * Math.sin(angle) * 0.55,  // vertical squash
            seed:  p.random(4000),
            layer: Math.floor(p.random(3)),     // 0=outer 1=mid 2=inner
          };
        });
      }

      // ── DRAW LOOP ───────────────────────────────────────────────
      p.draw = function() {
        cur.valence      = p.lerp(cur.valence,      tgt.valence,      lerpSpd);
        cur.energy       = p.lerp(cur.energy,        tgt.energy,       lerpSpd);
        cur.acousticness = p.lerp(cur.acousticness,  tgt.acousticness, lerpSpd);
        cur.hue          = lerpHue(cur.hue, tgt.hue, lerpSpd);

        drawBackground();
        drawNebula();
        drawBgStars();
        drawFgStars();
        drawHeroStars();
        drawPortrait();
        if (noTrack) drawPrompt();
      };

      function lerpHue(a, b, t) {
        let d = b - a;
        if (d >  180) d -= 360;
        if (d < -180) d += 360;
        return (a + d * t + 360) % 360;
      }

      // ── BACKGROUND — pure deep space black, every frame ─────────
      function drawBackground() {
        // Always near-black. Space is black. Colour comes from nebula only.
        // Avoids any hue/NaN issues making the background go white.
        p.background(0, 0, 5);
      }

      // ── NEBULA ──────────────────────────────────────────────────
      // A soft cloud centred on screen — dark space always visible around it.
      // Three hue-shifted layers simulate emission/reflection banding.
      function drawNebula() {
        const t    = p.frameCount * 0.00025;
        const cx   = p.width  * 0.5;
        const cy   = p.height * 0.46;
        // maxR caps at ~25% of the shorter screen dimension — nebula stays central
        const maxR = Math.min(p.width, p.height) * 0.25;

        const soft = p.map(cur.acousticness, 0, 1, 0.7, 1.2);
        const bri  = p.map(cur.energy,  0, 1, 30, 70);
        const sat  = p.map(cur.energy,  0, 1, 55, 88);

        const hOff = [-22, 0, 26];
        const aW   = [0.6, 1.0, 0.5];

        for (const pt of nebParticles) {
          const n    = p.noise(pt.seed * 0.35 + t, pt.seed * 0.22 + t * 0.58);
          const dist = Math.sqrt(pt.nx * pt.nx + pt.ny * pt.ny);
          const fall = Math.max(0, 1 - dist);
          // Alpha kept very low — individual particles are nearly transparent
          // so the accumulation reads as a soft glow, not a solid fill
          const alpha = n * fall * fall * 7 * soft * aW[pt.layer];
          if (alpha < 0.3) continue;

          const h  = (cur.hue + hOff[pt.layer] + 360) % 360;
          const st = 0.65 + n * 0.65;
          const x  = cx + pt.nx * maxR * st;
          const y  = cy + pt.ny * maxR * st;
          const sz = maxR * 0.4 * soft * (0.2 + n * 0.8);

          p.fill(h, sat, bri, alpha);
          p.ellipse(x, y, sz, sz * 0.78);
        }

        // Subtle central glow — never opaque
        p.fill(cur.hue, sat * 0.4, Math.min(100, bri * 1.3),
               p.map(cur.energy, 0, 1, 3, 10));
        p.ellipse(cx, cy, maxR * 0.22 * soft, maxR * 0.14 * soft);
      }

      // ── BACKGROUND STARS — faint, always on ─────────────────────
      function drawBgStars() {
        for (const s of bgStars) {
          // Very slight hue tint so they blend with the nebula colour
          p.fill(cur.hue, 10, 94, s.a);
          p.ellipse(s.x * p.width, s.y * p.height, s.sz, s.sz);
        }
      }

      // ── FOREGROUND STARS — count driven by energy ────────────────
      function drawFgStars() {
        const count = Math.floor(p.map(cur.energy, 0, 1, 25, fgStars.length));
        const t = p.frameCount * 0.001;

        for (let i = 0; i < count; i++) {
          const s = fgStars[i];
          const twinkle = 0.6 + 0.4 * Math.sin(t * 2.6 + s.tw);
          const alpha = 70 * twinkle * p.map(cur.energy, 0, 1, 0.35, 1.0);

          // Subtle parallax: deeper stars drift slightly more slowly
          const x = (s.x + Math.sin(t * 0.28 + s.z * 5) * s.z * 0.011) * p.width;
          const y = (s.y + Math.cos(t * 0.22 + s.z * 4) * s.z * 0.008) * p.height;

          // Stars are mostly white — just a whisper of the nebula hue
          p.fill(cur.hue, 7, 98, alpha);
          p.ellipse(x, y, s.sz * twinkle, s.sz * twinkle);
        }
      }

      // ── HERO STARS — bright points with layered bloom ───────────
      function drawHeroStars() {
        const t = p.frameCount * 0.0007;
        for (const s of heroStars) {
          const twinkle = 0.82 + 0.18 * Math.sin(t * 1.6 + s.tw);
          const x = s.x * p.width;
          const y = s.y * p.height;
          const sz = s.sz * twinkle;

          // Three-ring bloom: outer dim hued glow, mid near-white, core pure white
          p.fill(cur.hue, 20, 100, 6);
          p.ellipse(x, y, sz * 8, sz * 8);
          p.fill(cur.hue, 8,  100, 16);
          p.ellipse(x, y, sz * 3.5, sz * 3.5);
          p.fill(0, 0, 100, 92 * twinkle);
          p.ellipse(x, y, sz, sz);
        }
      }

      // ── DATA PORTRAIT ────────────────────────────────────────────
      function drawPortrait() {
        const mx = 34;
        const r  = 19;
        const my = p.height - 34 - r - 22;

        p.push();
        p.translate(mx, my);
        p.noFill();

        // Outer arc: valence (hue of current environment)
        p.strokeWeight(1.2);
        p.stroke(cur.hue, 68, 90, 55);
        p.arc(0, 0, r * 2, r * 2, -p.HALF_PI,
              -p.HALF_PI + cur.valence * p.TWO_PI);

        // Inner arc: energy
        p.stroke((cur.hue + 35) % 360, 58, 82, 48);
        p.arc(0, 0, r * 1.28, r * 1.28, -p.HALF_PI,
              -p.HALF_PI + cur.energy * p.TWO_PI);

        if (!noTrack) {
          p.noStroke();
          p.textFont('Courier New');
          p.textAlign(p.LEFT, p.TOP);
          p.textSize(9);
          p.fill(0, 0, 90, 58);
          p.text(trunc(trackName, 22),  -r, r + 12);
          p.textSize(8);
          p.fill(0, 0, 62, 40);
          p.text(trunc(artistName, 22), -r, r + 24);
        }
        p.pop();
      }

      function trunc(s, n) { return s.length > n ? s.slice(0, n) + '…' : s; }

      // ── PROMPT — shown before first track selected ───────────────
      function drawPrompt() {
        p.push();
        p.noStroke();
        p.fill(0, 0, 72, 18);
        p.textFont('Courier New');
        p.textSize(10);
        p.textAlign(p.CENTER, p.CENTER);
        p.text('search for a song below', p.width / 2, p.height / 2 + 95);
        p.pop();
      }

    }); // end p5
  </script>

</body>
</html>
